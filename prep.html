<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Private interview prep | The Career Architect</title><link rel="stylesheet" href="styles.css"><style>main{max-width:860px;margin:2rem auto;padding:1rem}.card{background:white;border:1px solid #dce1e8;border-radius:18px;padding:1.5rem;margin-bottom:1rem}.chat{min-height:250px;max-height:55vh;overflow:auto}.bubble{padding:.8rem 1rem;border-radius:12px;margin:.7rem 0;white-space:pre-wrap}.user{background:#e8f4ef;margin-left:12%}.assistant{background:#f1f3f7;margin-right:12%}textarea{width:100%;min-height:80px;padding:.8rem}button{cursor:pointer}.question{display:block;margin:.5rem 0;text-align:left}li{margin:.6rem 0}</style></head><body><main><p><a href="/">← The Career Architect</a></p><h1>Your interview prep</h1><p>Practice answers with your private AI coach. Use only details you can truthfully support in an interview.</p><div id="status" role="status"></div><section class="card"><h2>Questions to practice</h2><div id="questions"></div></section><section class="card"><h2>Chat with your coach</h2><div id="chat" class="chat" aria-live="polite"></div><form id="form"><label for="message">Your answer or question</label><textarea id="message" required maxlength="1200" placeholder="Ask me an interview question for my target role"></textarea><button class="btn btn-accent" id="send">Send</button></form></section></main><script>
const params=new URLSearchParams(location.search),id=params.get("id"),token=params.get("token"),history=[];
const status=document.getElementById("status"),chat=document.getElementById("chat"),form=document.getElementById("form"),message=document.getElementById("message");
async function api(body){const r=await fetch("/api/prep-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,token,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
function bubble(role,value){const el=document.createElement("div");el.className="bubble "+role;el.textContent=value;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
(async()=>{try{const d=await api({});status.textContent=`Welcome, ${d.name}. Choose a question below or write your own.`;const box=document.getElementById("questions");(d.questions||[]).forEach((q,i)=>{const b=document.createElement("button");b.className="question";b.type="button";b.textContent=`${i+1}. ${q.question}`;b.onclick=()=>{message.value=`Help me practice this question: ${q.question}`;message.focus()};box.appendChild(b)})}catch(e){status.textContent=e.message;form.hidden=true}})();
form.addEventListener("submit",async e=>{e.preventDefault();const value=message.value.trim();if(!value)return;const prior=history.slice(-8);bubble("user",value);history.push({role:"user",content:value});message.value="";document.getElementById("send").disabled=true;try{const d=await api({message:value,history:prior});bubble("assistant",d.reply);history.push({role:"assistant",content:d.reply})}catch(err){status.textContent=err.message}finally{document.getElementById("send").disabled=false}});
</script></body></html>
