<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password - The Career Architect</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0E1733" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230E1733'/%3E%3Cpath d='M11 30 L20 11 L29 30' fill='none' stroke='%2327C285' stroke-width='3.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cline x1='15' y1='23.5' x2='25' y2='23.5' stroke='%2327C285' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='10' r='2.4' fill='%23D99A28'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .field{margin-bottom:1rem}.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.35rem}
  .field input{width:100%;padding:.7rem .85rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--white);color:var(--ink)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:1.8rem;max-width:420px;margin:0 auto}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-in">
  <a class="brand" href="/index.html"><svg class="brand-mark" width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0E1733"/><path d="M11 30 L20 11 L29 30" fill="none" stroke="#27C285" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="15" y1="23.5" x2="25" y2="23.5" stroke="#27C285" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="10" r="2.4" fill="#D99A28"/></svg><span>The Career Architect</span></a>
</div></nav>

<main class="wrap" style="padding:3rem 0">
  <div class="card">
    <h1 style="font-size:1.5rem;margin-bottom:.4rem">Set a new password</h1>
    <p style="color:var(--slate);font-size:.92rem;margin-bottom:1.3rem" id="sub">Verifying your reset link…</p>

    <div id="form" style="display:none">
      <div class="field"><label for="pw">New password</label><input type="password" id="pw" minlength="8" placeholder="At least 8 characters" autocomplete="new-password" /></div>
      <div class="field"><label for="pw2">Confirm password</label><input type="password" id="pw2" minlength="8" placeholder="Re-enter password" autocomplete="new-password" /></div>
      <button class="btn btn-accent" id="save" type="button" style="width:100%;justify-content:center">Update password</button>
    </div>

    <div id="msg" class="notice hidden" style="margin-top:1rem"></div>
    <p style="margin-top:1.2rem;font-size:.9rem"><a href="/seeker.html" style="color:var(--emerald)">← Back to sign in</a></p>
  </div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const $ = id => document.getElementById(id);
function msg(t,k){ const m=$("msg"); m.className="notice notice-"+k; m.textContent=t; m.classList.remove("hidden"); }

if(!SUPABASE_URL || !SUPABASE_ANON_KEY){ $("sub").textContent="Account system isn't configured."; }
else {
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let canReset = false;

  // Supabase parses the recovery token from the URL and fires this event.
  sb.auth.onAuthStateChange((event, session) => {
    if(event === "PASSWORD_RECOVERY" || (session && !canReset)){
      canReset = true;
      $("sub").textContent = "Choose a new password for your account.";
      $("form").style.display = "block";
    }
  });

  // Fallback: if a session already exists shortly after load, allow reset.
  setTimeout(async ()=>{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ canReset = true; $("sub").textContent="Choose a new password for your account."; $("form").style.display="block"; }
    else if(!canReset){ $("sub").textContent="This reset link is invalid or has expired. Request a new one from the sign-in page."; }
  }, 1500);

  $("save").onclick = async ()=>{
    const pw=$("pw").value, pw2=$("pw2").value;
    if(pw.length<8){ msg("Password must be at least 8 characters.","err"); return; }
    if(pw!==pw2){ msg("Passwords don't match.","err"); return; }
    $("save").disabled=true;
    try{
      const { error } = await sb.auth.updateUser({ password: pw });
      if(error) throw error;
      $("form").style.display="none";
      msg("Password updated. Redirecting you to your account…","ok");
      setTimeout(()=>location.href="/seeker.html", 1800);
    }catch(e){ msg(e.message || "Couldn't update password.","err"); $("save").disabled=false; }
  };
}
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
