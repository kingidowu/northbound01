<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 64" role="img" aria-label="The Career Architect">
  <!-- mark: a drafting "A" (Architect) rising to a plotted gold apex -->
  <g transform="translate(8,12)">
    <rect width="40" height="40" rx="9" fill="#0E1733"/>
    <path d="M11 30 L20 11 L29 30" fill="none" stroke="#27C285" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="15" y1="23.5" x2="25" y2="23.5" stroke="#27C285" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="10" r="2.4" fill="#D99A28"/>
  </g>
  <!-- wordmark -->
  <text x="64" y="27" font-family="'Space Mono',monospace" font-size="9" letter-spacing="3" fill="#5A6280">THE</text>
  <text x="64" y="48" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#0E1733">Career <tspan fill="#16895B">Architect</tspan></text>
</svg>
